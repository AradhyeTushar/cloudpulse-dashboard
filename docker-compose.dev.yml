# Development Docker Compose Overrides (docker compose -f docker-compose.yml -f docker-compose.dev.yml up)
services:
  frontend:
    ports:
      - "5173:80"
      - "3000:80"

  backend:
    ports:
      - "8080:8080"
    environment:
      ENV: development

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3001:3000"
