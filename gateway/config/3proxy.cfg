# CloudPulse 3proxy Gateway Configuration
# High-concurrency proxy routing configuration for HTTP(S) and SOCKS5

nserver 8.8.8.8
nserver 1.1.1.1
nscache 65536
timeouts 1 5 30 60 180 1800 15 60

# Authentication mode: strong credentials or IP whitelist
auth strong
users "user:CL:pass123"

# Max connections & concurrency limits
maxconn 10000

# Access Control Lists
allow * * * 80,443,8080,8443,53

# SOCKS5 Proxy Service on port 1080
auth strong
socks -p1080

# HTTP/HTTPS Connect Proxy Service on port 8000
auth strong
proxy -p8000 -n -a

# Flush access rules
flush
