version: '3.8'

services:
  # 1. PostgreSQL Application Database
  postgres:
    image: postgres:16-alpine
    container_name: cloudpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cloudpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Session & Rate Limiting Store
  redis:
    image: redis:7-alpine
    container_name: cloudpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Prometheus Telemetry Collector
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cloudpulse-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  # 4. CloudPulse Go API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpulse-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/cloudpulse?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: cloudpulse_production_grade_super_secret_jwt_key_32_bytes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
